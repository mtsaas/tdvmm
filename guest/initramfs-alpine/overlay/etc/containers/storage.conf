# deterministic-vmm guest container storage.
#
# The rootfs is an initramfs (ramfs), so podman's graph store must live on a
# real, size-capped filesystem. init mounts a tmpfs at /var/lib/containers and
# seeds it from the baked-in store before podman runs.
#
# Graph driver: "vfs". Deliberately not "overlay": overlayfs-on-tmpfs needs
# trusted xattrs / features tmpfs does not reliably provide, and the baked
# image is tiny, so the extra RAM of a full-copy vfs layer is negligible. This
# is the spec-sanctioned fallback (overlay-on-tmpfs friction -> vfs).
[storage]
driver = "vfs"
graphroot = "/var/lib/containers/storage"
runroot = "/run/containers/storage"

[storage.options]
