# dvmm guest podman engine/network defaults.
#
# No systemd in this guest, so use the cgroupfs cgroup manager and a file event
# logger (the default journald logger needs systemd). netavark is the network
# backend; force its native nftables firewall driver (the guest kernel enables
# the nftables inet family + masquerade/fib/reject expressions for exactly
# this).

[containers]
# No journald in this guest; use per-container k8s-file logs so `podman logs -f`
# works for containers created via the compose (podman system service) API.
log_driver = "k8s-file"

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
runtime = "crun"

[network]
network_backend = "netavark"
firewall_driver = "nftables"
