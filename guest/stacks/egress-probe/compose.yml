# tdvmm egress-probe -- the --allow-egress end-to-end / safety-suite stack.
#
# One container: the pinned curl image, entrypoint overridden to run the
# bind-mounted probe.sh. The probe reaches the guest forwarder at its bridge
# gateway on :1080 (ALL_PROXY / socks5h) and, through it, the test-owned loopback
# endpoint on the HOST (127.0.0.1:<ephemeral>). Fully offline: the "external"
# endpoint is host loopback, never the internet.
#
# The endpoint URL and the probe mode are chosen at test time (the port is
# ephemeral), so they arrive on the kernel cmdline (tdvmm.egress_url= /
# tdvmm.egress_mode=), which the probe reads from /proc/cmdline. ALL_PROXY is a
# documented default; the probe derives the real gateway at runtime.
services:
  probe:
    image: docker.io/curlimages/curl@sha256:c1fe1679c34d9784c1b0d1e5f62ac0a79fca01fb6377cdd33e90473c6f9f9a69
    entrypoint: ["/bin/sh", "/opt/tdvmm/probe.sh"]
    environment:
      ALL_PROXY: "socks5h://10.88.0.1:1080"
    volumes:
      - ./probe.sh:/opt/tdvmm/probe.sh:ro
