# tdvmm egress T3b -- guest-driven negative control: a jump against an open session
# ABORTS the run. Run with TDVMM_EGRESS_UNSAFE_JUMPS=1 (gate park skipped, tripwire
# live). The probe holds a connection open; the safety suite asserts the run aborts
# with "egress gate breached" and a nonzero exit. No verdict is reached.
name: egress-t3b-gate-breach
run:
  cmdline: "console=ttyS0 reboot=t panic=1 pci=off no_timer_check tsc=reliable tdvmm.stack=1 tdvmm.egress_mode=t3b"
  until: done
steps:
  - name: wait-probe-up
    at: 0s
    wait_for:
      probe: { exec: { container: probe, cmd: "true" } }
      until: exit_zero
      every: 5s
      timeout: 3m
