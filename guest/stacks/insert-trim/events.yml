# dvmm — Phase-C bridge round-trip (guest-assertion SDK).
#
#   dvmm test insert-trim --scenario events.yml   ->   PASS, exit 0
#
# The "SDK" is literally one line: a workload container echoes a JSON assertion
# event to /run/dvmm/events; the agent (outside the containers) forwards it over
# ttyS1; the host records it (vtsc-stamped) and folds it into the verdict. No
# client library, no new transport — just a pipe.
#
# `run.until: done` keeps the run alive with NO timer until the guest emits
# {"kind":"done"}; the assertion ledger then decides the verdict.

name: bridge-roundtrip

run:
  cmdline: "console=ttyS0 reboot=t panic=1 pci=off no_timer_check tsc=reliable dvmm.stack=1 dvmm.interval=3600 dvmm.maxrows=5 dvmm.hc_tick=2"
  until: done

steps:
  # Wait until the service container is up enough to exec into.
  - name: wait-service-up
    at: 0s
    wait_for:
      probe: { exec: { container: service, cmd: "true" } }
      until: exit_zero
      every: 10s
      timeout: 5m
  # Emit a satisfied `sometimes` assertion, then `done` to end the run.
  - name: emit-events
    at: 0s
    exec:
      container: service
      cmd: |
        echo '{"kind":"sometimes","name":"bridge_rt","ok":true}' > /run/dvmm/events
        echo '{"kind":"done"}' > /run/dvmm/events
    expect: { exit: 0 }
