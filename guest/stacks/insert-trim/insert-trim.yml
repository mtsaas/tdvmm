# dvmm TEST-1a — the insert-trim stack expressed as a test scenario.
#
#   dvmm test insert-trim.dvmm --scenario insert-trim.yml   ->   PASS, exit 0
#
# The platform testing itself: wait for Postgres to be ready, fast-forward through
# virtual hours, and assert (via psql, over the bridge, by name) that the events
# table's row count ACCRUES at the interval and then CAPS at MAX_ROWS.
#
# The workload inserts one row every INTERVAL_SECONDS of *guest* time and trims to
# MAX_ROWS. This scenario runs it at interval=3600s (1 virtual hour) and, so the
# cap is observable in a handful of jumps, MAX_ROWS=5 (via `run.cmdline`, which
# overrides the artifact's baked `dvmm.maxrows`). With inserts at ~0h,1h,2h,...:
#   * by 2.5h  the count has grown but not yet capped  ->  1..4
#   * by 6.5h  ~7 inserts have happened, trimmed to 5  ->  exactly 5 (the cap)
# Fast-forward collapses the 6.5 virtual hours into seconds of wall time.

name: insert-trim-accrual-and-cap

run:
  # Override the baked cmdline: 1-hour interval, cap of 5 (so the cap shows fast).
  # console stays on ttyS0 — ttyS1 is the control channel, owned by the agent.
  cmdline: "console=ttyS0 reboot=t panic=1 pci=off no_timer_check tsc=reliable dvmm.stack=1 dvmm.interval=3600 dvmm.maxrows=5 dvmm.hc_tick=2"

steps:
  # 1. Readiness: poll pg_isready (in the service container, reaching postgres by
  #    name over the bridge) until it succeeds, or 5 virtual minutes pass.
  - name: wait-postgres-ready
    at: 0s
    wait_for:
      probe:
        exec:
          container: service
          cmd: "pg_isready -q"
      until: exit_zero
      every: 15s
      timeout: 5m

  # 2. Accrual: after 2.5 virtual hours the row count has grown but not capped.
  - name: rowcount-accruing
    at: 2.5h
    exec:
      container: service
      cmd: "psql -tAc 'select count(*) from events;'"
    expect:
      exit: 0
      output_matches: '^[1-4]$'

  # 3. Cap: by 6.5 virtual hours >5 inserts have happened; trim holds it at 5.
  - name: rowcount-capped-at-maxrows
    at: 6.5h
    exec:
      container: service
      cmd: "psql -tAc 'select count(*) from events;'"
    expect:
      exit: 0
      output_matches: '^5$'

  # 4. The stack stayed healthy throughout (no crashed/exited container).
  - name: stack-still-running
    at: 6.5h
    containers: all_running
