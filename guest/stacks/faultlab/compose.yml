# dvmm TEST-1b FAULT-LAB stack.
#
# A minimal two-service stack purpose-built for fault injection:
#   * db     — a normal Postgres server (the dependency).
#   * client — a long-lived idle container on the SAME compose network that
#              reaches `db` BY NAME. It just keeps itself alive (a sleep loop);
#              the test harness `podman exec`s connectivity probes (pg_isready /
#              psql) INTO it, so it survives `db` dying or being partitioned and
#              can observe both the fault EFFECT and the RECOVERY.
#
# Both services reuse the ONE pinned Postgres digest (image-based, closed world),
# exactly like the insert-trim stack — client's entrypoint is overridden to a keepalive
# loop. Nothing here writes rows; the point is connectivity, not a workload, so the
# scenarios can kill/stop/start `db` and partition/heal `client`<->`db` cleanly.
#
# Used by: kill-recover.yml, partition-heal.yml, unexpected-death.yml.

services:
  db:
    image: docker.io/library/postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: appdb
    shm_size: 256m

  client:
    image: docker.io/library/postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    depends_on:
      - db
    # Keepalive: stay up forever with no workload, so the harness can exec probes
    # into it across a fault + recovery. A plain sleep loop HLTs the guest between
    # ticks, so it stays fast-forward-friendly.
    entrypoint: ["/bin/sh", "-c", "while true; do sleep 3600; done"]
    environment:
      PGHOST: db
      PGUSER: postgres
      PGDATABASE: appdb
