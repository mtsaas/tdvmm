# tdvmm Phase-2b CORPUS stack #2: CONFIGPIPELINE
#
# A realistic "worker + sidecar sharing state" shape that exercises the build /
# bind / volume features TOGETHER:
#   - a build: context (the worker is built HOST-SIDE at bake time from a
#     digest-pinned Alpine base; nothing is built in the guest);
#   - a relative READ-WRITE bind (./config -> /etc/app:rw): bake-stack
#     MATERIALIZES ./config into the guest image and mounts it rw. The baked
#     ./config/app.conf proves materialization; writes to it land + read back and
#     are ephemeral (guest fs is tmpfs -- identical baked state every boot);
#   - a NAMED VOLUME (state) SHARED across BOTH services: the worker writes it and
#     the sidecar reads it back, proving cross-service named-volume sharing;
#   - a service-started depends_on (sidecar after worker) -- variety vs. the
#     service_healthy gates in the other corpus stacks;
#   - closed world: no runtime egress, no host filesystem.

services:
  worker:
    # A build: context (built host-side at bake time). image: names the result.
    build:
      context: ./worker
      dockerfile: Containerfile
    image: localhost/tdvmm-configpipeline-worker:corpus
    environment:
      INTERVAL_SECONDS: "${TDVMM_INTERVAL:-3600}"
    volumes:
      - ./config:/etc/app:rw   # relative RW bind -> materialized, mounted rw
      - state:/var/state       # named volume -> tmpfs-backed, shared w/ sidecar

  sidecar:
    image: docker.io/library/busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
    depends_on:
      - worker
    volumes:
      - state:/var/state:ro    # reads what the worker publishes (shared volume)
    command:
      - /bin/sh
      - -c
      - |
        echo "TDVMM_SIDECAR_START ts=$$(date -u +%H:%M:%S)"
        # Poll the SHARED named volume on a short cadence (a virtual sleep FF
        # collapses) so we reliably observe the worker's write regardless of
        # start order, and announce the first time we see it.
        seen=0
        i=0
        while :; do
          i=$$((i + 1))
          latest="$$(cat /var/state/latest.txt 2>/dev/null)"
          echo "TDVMM_SIDECAR_READ iter=$$i latest=$${latest:-<none>} ts=$$(date -u +%H:%M:%S)"
          case "$$latest" in
            worker-iter-*)
              if [ "$$seen" -eq 0 ]; then
                echo "TDVMM_SIDECAR_SHARED_OK latest=$$latest (read worker data via shared named volume)"
                seen=1
              fi
              ;;
          esac
          sleep 5
        done

volumes:
  state:
