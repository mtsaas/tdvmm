# dvmm DEMO scenario — the flagship capability reference as a test.
#
#   dvmm test demo.dvmm --scenario demo.yml --logs-dir /tmp/demo-logs  ->  PASS, exit 0
#
# Drives a full virtual HOUR of the gRPC order stack under fast-forward (a rollup
# cycle every ~3 virtual minutes), then injects a Postgres fault mid-run and proves
# the services retry + recover (they never die) and the data resumes — all in a few
# SECONDS of wall clock. The per-service logs (--logs-dir) are the narrative: the
# steady gRPC traffic, a fault gap, and recovery.
#
# Timeline (virtual minutes; the workload runs once every ~3 min, gated on
# postgres+redis healthy so it begins within the first minute or two):
#   0m       wait for postgres + redis ready and the workload up
#   15m,25m  assert the worker's summaries table is accruing
#   30m      KILL postgres  (api/worker/client log retries; they do NOT exit)
#   32m      START postgres (heal — same container, data intact)
#   34m      wait for postgres ready again
#   45m      assert summaries RESUMED growing after the gap
#   56m      final: an hour's worth of summaries; postgres order count == redis total
#            (the api kept the two stores consistent across the fault); all up.
#
# postgres is deliberately SIGKILLed, so it is declared in expect_death: a killed
# Postgres exits 137, which must not count as an unexpected death (same policy as
# faultlab/kill-recover.yml).

name: demo-gRPC-hour-with-fault

expect_death: [postgres]

run:
  # ~3-virtual-minute cadence (dvmm.interval=180) so a full hour's narrative — many
  # rollups, a fault, and recovery — completes in seconds of wall clock. hc_tick=30
  # runs the healthcheck ticker every 30 virtual seconds so the service_healthy
  # gate resolves early (not at the first hour). console on ttyS0; ttyS1 is the
  # agent control channel.
  cmdline: "console=ttyS0 reboot=t panic=1 pci=off no_timer_check tsc=reliable dvmm.stack=1 dvmm.interval=180 dvmm.hc_tick=30"

steps:
  # 1. Readiness: postgres accepts connections (checked inside the pg container).
  - name: wait-postgres-ready
    at: 0s
    wait_for:
      probe:
        exec:
          container: postgres
          cmd: "pg_isready -U postgres -d appdb"
      until: exit_zero
      every: 10s
      timeout: 5m

  # 2. Readiness: redis answers PING (checked inside the redis container).
  - name: wait-redis-ready
    at: 0s
    wait_for:
      probe:
        exec:
          container: redis
          cmd: "redis-cli ping"
      until: exit_zero
      every: 10s
      timeout: 5m

  # 3. The gated workload is up: the worker container is running (=> postgres was
  #    healthy and the depends_on gate resolved). Fast-forward collapses the wait.
  - name: wait-workload-up
    at: 0s
    wait_for:
      probe:
        exec:
          container: worker
          cmd: "true"
      until: exit_zero
      every: 30s
      timeout: 10m

  # 4. Accrual: by 15 virtual minutes the worker has written several summaries.
  - name: summaries-accruing
    at: 15m
    exec:
      container: postgres
      cmd: "psql -U postgres -d appdb -tAc 'select count(*) from summaries;'"
    expect:
      exit: 0
      output_matches: '^([2-9]|[1-9][0-9]+)$'

  # 5. Grown further by 25 virtual minutes.
  - name: summaries-grown
    at: 25m
    exec:
      container: postgres
      cmd: "psql -U postgres -d appdb -tAc 'select count(*) from summaries;'"
    expect:
      exit: 0
      output_matches: '^([5-9]|[1-9][0-9]+)$'

  # 6. FAULT: SIGKILL postgres. The next client submit + worker rollup now fail;
  #    they log retries and keep running (proven by all_running at the end).
  - name: kill-postgres
    at: 30m
    kill: postgres

  # 7. HEAL: restart the SAME postgres container (writable layer intact -> data
  #    survives), a bit after the workload has failed against it.
  - name: start-postgres
    at: 32m
    start: postgres

  # 8. RECOVERY: postgres accepts connections again.
  - name: wait-postgres-recovered
    at: 34m
    wait_for:
      probe:
        exec:
          container: postgres
          cmd: "pg_isready -U postgres -d appdb"
      until: exit_zero
      every: 10s
      timeout: 5m

  # 9. Summaries RESUMED growing after the gap (well past the pre-fault count).
  - name: summaries-resumed
    at: 45m
    exec:
      container: postgres
      cmd: "psql -U postgres -d appdb -tAc 'select count(*) from summaries;'"
    expect:
      exit: 0
      output_matches: '^([1-9][0-9]+)$'

  # 10. End of the hour: an hour's worth of summaries.
  - name: summaries-full-hour
    at: 56m
    exec:
      container: postgres
      cmd: "psql -U postgres -d appdb -tAc 'select count(*) from summaries;'"
    expect:
      exit: 0
      output_matches: '^(1[3-9]|[2-9][0-9])$'

  # 11. Cross-store consistency held across the fault: Postgres order count ==
  #     Redis orders:total (the api bumps Redis only after the pg write commits).
  #     Checked from inside the api container (it has psycopg2 + redis + both hosts).
  - name: pg-redis-consistent
    at: 56m
    exec:
      container: api
      cmd: "python3 /app/check.py"
    expect:
      exit: 0
      output_matches: 'consistent=True'

  # 12. Every service survived the fault (nothing crashed): all containers running.
  - name: all-services-running
    at: 56m
    containers: all_running
