# deterministic-vmm Phase-2b GO A/B stack (the TREATMENT).
#
# The exact insert/trim workload as the dogfood CONTROL stack
# (guest/stacks/dogfood/compose.yml), but the insert/trim service is a GO binary
# instead of a POSIX-shell loop. Postgres is byte-for-byte the same pinned image,
# the same schema, the same SQL — so the ONLY variable between the two stacks is
# the service's language RUNTIME. That isolation is a HARD requirement: if the Go
# service drifted behaviorally, the shell-vs-Go comparison would measure nothing.
#
# This stack is also the inaugural build:-context exercise. The `service` uses a
# build: (a Containerfile) instead of an image:. It is built HOST-SIDE at bake
# time (base images digest-pinned) and the output flows through the SAME squash /
# seed-store / compose.lock pipeline as any pulled image; nothing is ever built
# inside the guest.
#
# Runtime anchors (measured at defaults, NOT tuned):
#   - Go toolchain: pinned golang image go1.26.5 (see service/Containerfile + stack.lock)
#   - GOGC:       default (100) — not set
#   - GOMAXPROCS: defaults to the single guest vCPU (=1) — not set. Single-core
#                 already quiets the runtime, so the measured chattiness is a FLOOR.
#
# Knobs (INTERVAL_SECONDS / MAX_ROWS) use ${VAR:-default} interpolation so the
# committed lockfile stays deterministic while the FF demo / comparison harness
# override cadence + cap via the kernel cmdline (dvmm.interval= / dvmm.maxrows=).

services:
  postgres:
    # Pinned by digest (= postgres 16.14-alpine); the SAME digest the dogfood
    # control stack uses, so the database side is identical.
    image: docker.io/library/postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: appdb
    shm_size: 256m
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro

  service:
    # A build: context (new in 2b). Built host-side at bake time; image: names the
    # built result that bake-stack pins by digest into compose.lock.yml.
    build:
      context: ./service
      dockerfile: Containerfile
    image: localhost/dvmm-go-service:2b
    depends_on:
      - postgres
    # It reaches the db container BY NAME ("postgres") over the compose network
    # (netavark + aardvark DNS). Same env knobs/contract as the shell service.
    environment:
      INTERVAL_SECONDS: "${DVMM_INTERVAL:-3600}"
      MAX_ROWS: "${DVMM_MAXROWS:-1000}"
      PGHOST: postgres
      PGUSER: postgres
      PGDATABASE: appdb
