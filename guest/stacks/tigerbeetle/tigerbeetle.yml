# dvmm -- TigerBeetle cluster scenario (3-replica fault tolerance).
#
#   dvmm test tigerbeetle.dvmm --scenario tigerbeetle.yml --mem 12288 --logs-dir /tmp/tb-logs
#
# The consensus story: a 3-replica cluster tolerates losing one replica. We prove
# double-entry always balances (A.debits_posted == B.credits_posted), KILL a
# backup, show the cluster KEEPS committing (the balance grows while it is down),
# then HEAL it and confirm every container is back. A SIGKILLed replica exits 137
# on purpose -> declared in expect_death.
#
# PROBE ROBUSTNESS (learned the hard way): every check reaches the cluster from
# the client container via `tigerbeetle repl`. Two rules keep those execs from
# hanging:
#   1. Short-circuit the pipeline (pipe repl through `head`, and use `head -1` /
#      `grep -q`) so the repl process always receives SIGPIPE and exits promptly.
#      A pipeline that reads repl to EOF (`$(repl ...)` alone, or `... | tail`)
#      can hang when repl lingers under load.
#   2. Prove "transfers continue during the fault" by OBSERVING the balance GROW
#      (a read), not by submitting a write through exec -- a create_transfers via
#      `podman exec` right after a kill can block, even though the in-cluster
#      client keeps committing. We assert the effect, not our own write.
# Every repl check is a wait_for (retries), so an occasional slow exec is tolerated.
#
# mem: sized past the old 3 GiB cap -- each replica statically commits ~1.3-1.5
# GiB heap and preallocates a ~1.06 GiB data file, so 3 replicas need well over
# 6 GiB. Overridable with `--mem` (flag > scenario); we run it at 12288.

name: tigerbeetle-cluster-fault-tolerance

expect_death: [replica2]

run:
  mem: 6144
  # ~20 s client cadence so several accounting cycles (and post-fault growth)
  # play out quickly; fast-forward collapses the idle between them.
  cmdline: "console=ttyS0 reboot=t panic=1 pci=off no_timer_check tsc=reliable dvmm.stack=1 dvmm.interval=20"

steps:
  # 1. Readiness: the client container is up (=> its depends_on replicas started).
  - name: wait-client-up
    at: 0s
    wait_for:
      probe: { exec: { container: client, cmd: "true" } }
      until: exit_zero
      every: 3s
      timeout: 5m

  # 2. Readiness: the cluster answers a client request (primary elected).
  - name: wait-cluster-formed
    at: 0s
    wait_for:
      probe:
        exec:
          container: client
          cmd: "sh -c '. /tmp/tb-addresses; /tigerbeetle repl --cluster=0 --addresses=$ADDRESSES --command=\"lookup_accounts id=1;\" | grep -q id'"
      until: exit_zero
      every: 5s
      timeout: 5m

  # 3. Baseline invariant: double-entry balances -- account 1's debits_posted ==
  #    account 2's credits_posted, and money has moved (> 0).
  - name: invariant-baseline
    at: 90s
    wait_for:
      probe:
        exec:
          container: client
          cmd: "sh -c '. /tmp/tb-addresses; o=$(/tigerbeetle repl --cluster=0 --addresses=$ADDRESSES --command=\"lookup_accounts id=1, id=2;\" | head -40); d=$(echo \"$o\" | grep -oE \"\\\"debits_posted\\\": \\\"[0-9]+\\\"\" | grep -oE \"[0-9]+\" | head -1); c=$(echo \"$o\" | grep -oE \"\\\"credits_posted\\\": \\\"[0-9]+\\\"\" | grep -oE \"[0-9]+\" | sed -n 2p); [ -n \"$d\" ] && [ \"$d\" = \"$c\" ] && [ \"$d\" -gt 0 ]'"
      until: exit_zero
      every: 5s
      timeout: 3m

  # 4. FAULT: SIGKILL a backup. The cluster keeps a 2-of-3 quorum.
  - name: kill-replica2
    at: 2m
    kill: replica2

  # 5. Record the debits total at the moment the fault begins (short-circuit read).
  - name: record-fault-baseline
    at: 2m
    wait_for:
      probe:
        exec:
          container: client
          cmd: "sh -c '. /tmp/tb-addresses; v=$(/tigerbeetle repl --cluster=0 --addresses=$ADDRESSES --command=\"lookup_accounts id=1;\" | grep -oE \"\\\"debits_posted\\\": \\\"[0-9]+\\\"\" | grep -oE \"[0-9]+\" | head -1); [ -n \"$v\" ] && echo \"$v\" > /tmp/fault_base'"
      until: exit_zero
      every: 5s
      timeout: 2m

  # 6. TRANSFERS CONTINUE DURING THE FAULT: the debits total GROWS beyond the
  #    fault-start baseline -- i.e. the cluster committed new transfers while
  #    replica2 was down. (Observed via read; proves the effect, not our write.)
  - name: transfers-continue-during-fault
    at: 2m
    wait_for:
      probe:
        exec:
          container: client
          cmd: "sh -c '. /tmp/tb-addresses; cur=$(/tigerbeetle repl --cluster=0 --addresses=$ADDRESSES --command=\"lookup_accounts id=1;\" | grep -oE \"\\\"debits_posted\\\": \\\"[0-9]+\\\"\" | grep -oE \"[0-9]+\" | head -1); base=$(cat /tmp/fault_base 2>/dev/null || echo 2000000000); [ -n \"$cur\" ] && [ \"$cur\" -gt \"$base\" ]'"
      until: exit_zero
      every: 5s
      timeout: 3m

  # 7. Invariant still holds while replica2 is down.
  - name: invariant-during-fault
    at: 4m
    wait_for:
      probe:
        exec:
          container: client
          cmd: "sh -c '. /tmp/tb-addresses; o=$(/tigerbeetle repl --cluster=0 --addresses=$ADDRESSES --command=\"lookup_accounts id=1, id=2;\" | head -40); d=$(echo \"$o\" | grep -oE \"\\\"debits_posted\\\": \\\"[0-9]+\\\"\" | grep -oE \"[0-9]+\" | head -1); c=$(echo \"$o\" | grep -oE \"\\\"credits_posted\\\": \\\"[0-9]+\\\"\" | grep -oE \"[0-9]+\" | sed -n 2p); [ -n \"$d\" ] && [ \"$d\" = \"$c\" ] && [ \"$d\" -gt 0 ]'"
      until: exit_zero
      every: 5s
      timeout: 3m

  # 8. HEAL: restart replica2. Same container -> its rw layer and
  #    /data/2.tigerbeetle survive the kill, so it does ordinary crash recovery
  #    and catches up from the surviving quorum (no re-format). Its static IP
  #    (10.240.0.12) is re-applied on start, so replica0/1 -- which cached that
  #    literal in --addresses at boot -- reach it again and it can rejoin.
  - name: start-replica2
    at: 5m
    start: replica2

  # 9. RECOVERY: replica2 answers at its SERVICE address again. TigerBeetle binds
  #    addresses[replica] (its eth0 IP), NOT loopback -- so probe replica2:3000
  #    from the client (aardvark resolves it to the static IP), not 127.0.0.1.
  - name: wait-replica2-back
    at: 5m
    wait_for:
      probe:
        exec:
          container: client
          cmd: "sh -c 'nc -z replica2 3000'"
      until: exit_zero
      every: 5s
      timeout: 5m

  # 9b. REJOIN: replica2 re-established live VSR sessions with its peers -- an
  #     ESTABLISHED TCP connection to replica0 or replica1 (10.240.0.10/.11).
  #     Proves quorum PARTICIPATION, not merely a listening socket.
  - name: replica2-rejoined-quorum
    at: 5m
    wait_for:
      probe:
        exec:
          container: replica2
          cmd: "sh -c 'netstat -tn 2>/dev/null | grep ESTABLISHED | grep -qE \"10\\.240\\.0\\.1[01]\"'"
      until: exit_zero
      every: 5s
      timeout: 5m

  # 10. Cluster fully back: every container running (nothing crashed for good).
  - name: all-replicas-running
    at: 7m
    containers: all_running
