# deterministic-vmm -- TigerBeetle cluster stack (3 replicas + a demo client).
#
# ============================================================================
#  STATUS: RAM cap LIFTED, but still not a passing stack (new blocker below).
#
#  UPDATE (high-memory split): the hard 3072 MiB cap is gone. Guest RAM now
#  splits across the 32-bit MMIO gap (a low region below 3 GiB + a high region
#  based at 4 GiB), so `--mem 6144` is reachable. This stack now BAKES and BOOTS
#  with the guest kernel seeing the full ~6 GiB (BIOS-e820 shows the two RAM
#  ranges + an unbacked [3 GiB, 4 GiB) gap; `Memory: .../6291064K available`).
#
#  NEW BLOCKER (single vCPU): the 3-replica cluster still does not FORM. Bringing
#  up all three TigerBeetle replicas via `docker compose up` wedges the single
#  vCPU during container start -- the guest makes ZERO forward progress (the
#  kernel-log timestamp freezes at ~4.5 s and no replica ever prints), IDENTICAL
#  with fast-forward ON and OFF, so it is neither a RAM nor a fast-forward issue.
#  Three CPU-heavy consensus nodes (io_uring + ~100 Hz VSR tick + ~1.5 GiB heap
#  each) contend on ONE vCPU and never complete bring-up. This VMM is single-vCPU
#  by design, so there is no in-scope knob to give the cluster more CPUs.
#  (`--validate-only` still passes: the compose is a valid closed-world stack.)
# ============================================================================
#
# WHAT THIS WOULD BE
#   A 3-replica TigerBeetle consensus cluster (replica0/1/2) doing double-entry
#   accounting, plus a REPL-based client that opens two accounts and, each
#   virtual interval, moves money A->B and reads the balances back. The scenario
#   (tigerbeetle.yml) kills a replica, proves the client keeps transacting on the
#   surviving quorum, then heals it -- the whole point of a consensus cluster.
#
# FINDINGS (measured on the host with this exact image, runc + netavark +
# seccomp=unconfined, which mirrors the guest's podman/DNS/io_uring path):
#
#   1. ADDRESSING -- SOLVED. TigerBeetle's --addresses accepts only IPv4/IPv6
#      LITERALS; service names are rejected ("--addresses: invalid IPv4 or IPv6
#      address"). We stay closed-world by resolving the replica SERVICE NAMES to
#      their netavark IPs at start via getent, in fixed replica order (see
#      replica.sh / client.sh). Verified: the cluster forms, elects a primary,
#      and synchronizes clocks. No host networking, no hard-coded IPs.
#
#   2. RAM -- HARD BLOCKER. TigerBeetle statically commits ~1537 MiB of
#      anonymous (private-dirty, unreclaimable) heap PER replica at init -- even
#      with --development and --cache-grid=64MiB (the smallest knobs it exposes;
#      the ~1.5 GiB floor is compile-time, no runtime flag lowers it). Three
#      replicas = ~4.6 GiB of un-reclaimable RAM before the base runtime, the
#      client, or the (RAM-backed tmpfs) data files -- vs the hard 3072 MiB cap.
#      Corroborated by upstream: a SINGLE replica OOM-crashes on a 2 GB box
#      (tigerbeetle#2055), and the documented production minimum is 6 GiB/replica.
#      => was: 3 replicas cannot fit under the 3072 MiB cap.
#      RESOLVED (RAM) by the high-memory split: the guest now boots with 6144 MiB
#      and the cap no longer blocks. (The heaps are never even allocated now --
#      the single-vCPU wedge above happens earlier, at container bring-up.)
#
#   3. FAST-FORWARD -- SECONDARY BLOCKER. Idle replicas do NOT busy-poll the CPU
#      (~0.25% of one core; they HLT), which is good. BUT each replica wakes
#      ~103 times/second even when idle -- TigerBeetle's ~100 Hz VSR consensus
#      tick (ping/heartbeat/clock-sync), a compile-time constant with no CLI
#      knob. A guest woken ~100x/s per replica can barely fast-forward (the same
#      reason the demo had to drop Redis to --hz 1 and stretch Postgres timers).
#      So even if RAM fit, FF speedup would be poor and cadence-bound, not idle-
#      collapsed.
#
# HOW TO REVISIT: the RAM ceiling is no longer the blocker (the high-memory split
# lifted it). What remains is the single-vCPU wedge when three CPU-heavy consensus
# nodes start together. Revisiting would need either multi-vCPU support (out of
# scope for this single-vCPU VMM) or a smaller cluster / a custom-compiled
# TigerBeetle with a lighter static config (non-standard; contradicts "reuse the
# pinned official image"). Neither is in scope here.
#
# Image pinned by digest (closed world): resolve `ghcr.io/tigerbeetle/tigerbeetle`
# tag 0.17.7 -> the index digest below (amd64, Alpine 3.24 + busybox base,
# entrypoint `tini -- /tigerbeetle`, binary at /tigerbeetle, ~28 MiB).

services:
  replica0:
    image: ghcr.io/tigerbeetle/tigerbeetle@sha256:177d6fbd12a3dab1782212cdaf034b5f9cb1bf73804b66116980bfe1064cc3b6
    # io_uring is blocked by podman's DEFAULT seccomp profile (TigerBeetle then
    # dies with "io_uring is not available ... SystemOutdated"); the closed-world
    # guest kernel has CONFIG_IO_URING=y, so unconfine seccomp to let it through.
    security_opt: ["seccomp=unconfined"]
    entrypoint: ["/bin/sh", "/scripts/replica.sh", "0"]
    # Static IP on the user-defined `tb` network: a container's static address is
    # part of its stored network config, so netavark re-applies it on every
    # `podman start` -- including after a `kill:` fault. Dynamic IPAM would hand a
    # restarted replica a NEW ip, and since TigerBeetle fixes --addresses at start
    # (IP literals only, resolved once via getent), its peers would keep dialing
    # the dead old address and it could never rejoin the quorum. Stable addresses
    # make restart/heal a first-class, reproducible fault (Fable ruling).
    networks: { tb: { ipv4_address: 10.240.0.10 } }
    volumes:
      - ./replica.sh:/scripts/replica.sh:ro

  replica1:
    image: ghcr.io/tigerbeetle/tigerbeetle@sha256:177d6fbd12a3dab1782212cdaf034b5f9cb1bf73804b66116980bfe1064cc3b6
    security_opt: ["seccomp=unconfined"]
    entrypoint: ["/bin/sh", "/scripts/replica.sh", "1"]
    networks: { tb: { ipv4_address: 10.240.0.11 } }
    volumes:
      - ./replica.sh:/scripts/replica.sh:ro

  replica2:
    image: ghcr.io/tigerbeetle/tigerbeetle@sha256:177d6fbd12a3dab1782212cdaf034b5f9cb1bf73804b66116980bfe1064cc3b6
    security_opt: ["seccomp=unconfined"]
    entrypoint: ["/bin/sh", "/scripts/replica.sh", "2"]
    networks: { tb: { ipv4_address: 10.240.0.12 } }
    volumes:
      - ./replica.sh:/scripts/replica.sh:ro

  client:
    image: ghcr.io/tigerbeetle/tigerbeetle@sha256:177d6fbd12a3dab1782212cdaf034b5f9cb1bf73804b66116980bfe1064cc3b6
    security_opt: ["seccomp=unconfined"]
    entrypoint: ["/bin/sh", "/scripts/client.sh"]
    networks: { tb: { ipv4_address: 10.240.0.20 } }
    depends_on:
      - replica0
      - replica1
      - replica2
    environment:
      INTERVAL_SECONDS: "${DVMM_INTERVAL:-3600}"
    volumes:
      - ./client.sh:/scripts/client.sh:ro

# User-defined bridge network with a fixed subnet, so per-service ipv4_address is
# honored and stable across container restarts (closed-world: this is an internal
# subnet the guest owns, not a host address). Sole network in the guest; the
# 10.240.0.0/24 range avoids podman's 10.88/10.89 defaults.
networks:
  tb:
    ipam:
      config:
        - subnet: 10.240.0.0/24
