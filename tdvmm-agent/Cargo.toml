[package]
name = "tdvmm-agent"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Static (musl) guest-side control-channel executor for tdvmm. Baked into every .tdvmm; speaks tdvmm-proto over ttyS1."

[[bin]]
name = "tdvmm-agent"
path = "src/main.rs"

# DEP ALLOWLIST (Fable §1): tdvmm-proto + serde_json + std ONLY. `serde` (derive)
# is pulled in transitively by tdvmm-proto already, so declaring it here to derive
# the podman-ps parser adds NO new crate to the tree. Must NOT pull
# kvm-ioctls/vm-memory/linux-loader/vm-superio/libc/regex/etc. — enforced by
# scripts/agent_deps_check.sh against tdvmm-agent/deps.allow.
[dependencies]
tdvmm-proto = { path = "../tdvmm-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
