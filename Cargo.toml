[package]
name = "dvmm"
version = "0.1.0"
edition = "2021"
description = "A minimal single-vCPU, fast-forwardable KVM VMM for deterministic service-stack testing."
license = "Apache-2.0"

# Cargo WORKSPACE (Fable §1): three members — this root VMM package (`dvmm`), the
# protocol-only `dvmm-proto` lib, and the guest `dvmm-agent` bin. Single-crate-
# two-bins was REJECTED; the agent is its own crate with a minimal dep tree.
[workspace]
members = ["dvmm-proto", "dvmm-agent"]
# All three build/test by default so `cargo build --release` and the T0
# `cargo test --release` gate cover the proto goldens + the agent, not just the VMM.
default-members = [".", "dvmm-proto", "dvmm-agent"]
resolver = "2"

[[bin]]
name = "dvmm"
path = "src/main.rs"

[dependencies]
kvm-ioctls = "0.25"
kvm-bindings = { version = "0.14", features = ["fam-wrappers"] }
vm-memory = { version = "0.18", features = ["backend-mmap", "backend-atomic"] }
linux-loader = "0.14"
vmm-sys-util = "0.15"
vm-superio = "0.8"
libc = "0.2"
# OP-1a: the .dvmm single-file artifact (format v1). clap = the run/inspect/verify/
# boot subcommand CLI; serde/serde_json = the manifest (de)serialize; sha2 = member
# hashing + the whole-file identity. The canonical (deterministic) tar encode/decode
# is hand-rolled in `artifact.rs` — full control over byte layout for the
# bit-reproducible guarantee, and cheap single-member reads for `inspect`.
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
serde_yaml = "0.9.34"
regex = "1.13.1"
# Move 3 Step B: in-process gzip + tar, replacing the host `gzip -9 -n` and the
# `tar -xzf` shell-outs. `flate2` uses its DEFAULT (miniz_oxide) backend ONLY —
# a zlib/zlib-ng feature would reintroduce a C build dependency and break Move 1
# (verified via `cargo tree`). `tar` is pure-Rust archive read (extraction only).
flate2 = "=1.1.5"
tar = "=0.4.44"
# `dvmm build`'s single stepped progress spinner (Fable CLI-UX ruling). Root
# `dvmm` ONLY — FORBIDDEN in dvmm-agent/dvmm-proto (their dep trees are
# Fable-locked). Pinned to an exact version.
indicatif = "=0.18.6"
# The line-JSON control-channel wire types, shared with the guest dvmm-agent.
dvmm-proto = { path = "dvmm-proto" }

[profile.release]
debug = true

# The reproducible + size-optimized profile for the guest dvmm-agent (Fable §2).
# Profiles are workspace-global, so the agent gets its own custom profile rather
# than mutating [profile.release] (which the VMM needs with debug=true). Built via
# `cargo build -p dvmm-agent --profile agent-release --target x86_64-unknown-linux-musl`
# inside the pinned musl builder container.
[profile.agent-release]
inherits = "release"
opt-level = "z"
codegen-units = 1
lto = true
panic = "abort"
strip = "symbols"
debug = false
