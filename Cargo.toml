[package]
name = "deterministic-vmm"
version = "0.1.0"
edition = "2021"
description = "Step 1: a minimal single-vCPU KVM VMM that boots one Linux guest to a serial shell."
license = "Apache-2.0"

[[bin]]
name = "dvmm"
path = "src/main.rs"

[dependencies]
kvm-ioctls = "0.25"
kvm-bindings = { version = "0.14", features = ["fam-wrappers"] }
vm-memory = { version = "0.18", features = ["backend-mmap", "backend-atomic"] }
linux-loader = "0.14"
vmm-sys-util = "0.15"
vm-superio = "0.8"
libc = "0.2"

[profile.release]
debug = true
