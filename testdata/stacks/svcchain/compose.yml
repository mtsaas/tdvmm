# tdvmm Phase-2b CORPUS stack #3: SVCCHAIN
#
# A realistic 3-tier "db -> backend -> frontend" shape that proves health-gated
# ordering propagates across a TWO-HOP chain:
#   - `db` (Postgres) has a healthcheck; `backend` waits for db: service_healthy;
#   - `backend` (Postgres image, entrypoint-overridden via a relative RO bind)
#     connects to db, then touches a readiness file. It has its OWN healthcheck
#     (test the readiness file), so it only becomes healthy AFTER it has really
#     connected to the db;
#   - `frontend` waits for backend: service_healthy -- so the chain is strictly
#     ordered db-healthy -> backend-started -> backend-healthy -> frontend-started,
#     all resolved by the guest-side healthcheck ticker (no systemd).
# It also exercises a relative READ-ONLY bind (the backend loop script) and the
# insert/trim workload (so the corpus runner can assert cadence under FF). Closed
# world throughout.

services:
  db:
    image: docker.io/library/postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: appdb
    shm_size: 256m
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb"]
      interval: 2s
      timeout: 3s
      retries: 5
      start_period: 60s

  backend:
    # Reuse the pinned Postgres image (ships /bin/sh + psql + pg_isready) with its
    # entrypoint overridden to a bind-mounted loop -- so every image is one real
    # upstream digest (same technique as the insert-trim service).
    image: docker.io/library/postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/opt/tdvmm/backend-loop.sh"]
    environment:
      INTERVAL_SECONDS: "${TDVMM_INTERVAL:-3600}"
      MAX_ROWS: "${TDVMM_MAXROWS:-1000}"
      PGHOST: db
      PGUSER: postgres
      PGDATABASE: appdb
    volumes:
      - ./backend-loop.sh:/opt/tdvmm/backend-loop.sh:ro   # relative RO bind
    healthcheck:
      # healthy only AFTER backend-loop connects to db + creates the readiness file
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 2s
      timeout: 3s
      retries: 5
      start_period: 60s

  frontend:
    image: docker.io/library/busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
    depends_on:
      backend:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        echo "TDVMM_FRONTEND_UP backend-was-healthy ts=$$(date -u +%H:%M:%S)"
        while :; do sleep 3600; done
