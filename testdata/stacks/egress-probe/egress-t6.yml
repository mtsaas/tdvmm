# tdvmm egress T6 -- closed-world identity with the flag OFF. Run WITHOUT
# --allow-egress: the forwarder is not started, so the probe's proxy connect must
# fail fast. The safety suite also asserts no egress metrics were produced (schema
# stays 1) and TDVMM_CLOSED_WORLD_OK still prints.
name: egress-t6-closed-world
run:
  cmdline: "console=ttyS0 reboot=t panic=1 pci=off no_timer_check tsc=reliable tdvmm.stack=1 tdvmm.egress_mode=t6"
  until: done
steps:
  - name: wait-probe-up
    at: 0s
    wait_for:
      probe: { exec: { container: probe, cmd: "true" } }
      until: exit_zero
      every: 5s
      timeout: 3m
