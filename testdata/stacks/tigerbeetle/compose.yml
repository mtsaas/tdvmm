# tdvmm — TIGERBEETLE: a driver-controlled consensus fault test.
#
# A 3-replica TigerBeetle consensus cluster (replica0/1/2) doing double-entry
# accounting, plus a DRIVER container that tests it from the inside. There is no
# scenario file and no `tdvmm test` verb: the driver drives real transfers with
# the image's own REPL, injects a fault over the control socket (bind-mounted into
# every service automatically), and ends the run with a verdict.
#
#   tdvmm build tigerbeetle ./compose.yml
#   tdvmm run tigerbeetle --wall-timeout 300 --mem 10240   # 0 = PASS, 1 = FAIL
#
# What it proves is the point of a consensus cluster: it tolerates a MINORITY
# failure. The driver opens two accounts, moves money A->B, then KILLS one replica
# (a minority of three) with a transfer batch in flight. Commits must keep landing
# on the surviving quorum; the killed replica must really be down; and after a
# restart it must rejoin and accounting must continue. Kill/restart is the stack's
# first-class fault (stable addresses — below — make a restarted replica reachable
# at the same IP, so it rejoins the quorum).
#
# CLOSED-WORLD NOTES (measured on the host with this exact image):
#
#   ADDRESSING. TigerBeetle's --addresses accepts only IPv4/IPv6 LITERALS; service
#   names are rejected. Each replica resolves the replica service names to their
#   netavark IPs at start via getent, in fixed replica order (see replica.sh); the
#   driver uses the static IPs directly. No host networking, no hard-coded host IPs.
#
#   RAM. TigerBeetle statically commits ~1.5 GiB of heap per replica at init (a
#   compile-time floor; no runtime flag lowers it). Three replicas need ~4.6 GiB
#   of anonymous heap; with the base runtime, the RAM-backed container storage,
#   and the driver, `--mem 6144` OOMs the guest at start — run with `--mem 10240`.
#
#   IO_URING. Blocked by podman's default seccomp profile; the closed-world guest
#   kernel has CONFIG_IO_URING=y, so every TigerBeetle service unconfines seccomp.
#
# Image pinned by digest (closed world): ghcr.io/tigerbeetle/tigerbeetle 0.17.7
# (amd64, Alpine 3.24 + busybox base, binary at /tigerbeetle, ~28 MiB).

services:
  replica0:
    image: ghcr.io/tigerbeetle/tigerbeetle@sha256:177d6fbd12a3dab1782212cdaf034b5f9cb1bf73804b66116980bfe1064cc3b6
    security_opt: ["seccomp=unconfined"]
    entrypoint: ["/bin/sh", "/scripts/replica.sh", "0"]
    # Static IP on the user-defined `tb` network: a container's static address is
    # part of its stored network config, so netavark re-applies it on every
    # `podman start` — including after a `kill:` fault. Dynamic IPAM would hand a
    # restarted replica a NEW ip, and since TigerBeetle fixes --addresses at start
    # (IP literals only, resolved once via getent), its peers would keep dialing
    # the dead old address and it could never rejoin the quorum. Stable addresses
    # make restart/heal a first-class, reproducible fault (Fable ruling).
    networks: { tb: { ipv4_address: 10.240.0.10 } }
    volumes:
      - ./replica.sh:/scripts/replica.sh:ro

  replica1:
    image: ghcr.io/tigerbeetle/tigerbeetle@sha256:177d6fbd12a3dab1782212cdaf034b5f9cb1bf73804b66116980bfe1064cc3b6
    security_opt: ["seccomp=unconfined"]
    entrypoint: ["/bin/sh", "/scripts/replica.sh", "1"]
    networks: { tb: { ipv4_address: 10.240.0.11 } }
    volumes:
      - ./replica.sh:/scripts/replica.sh:ro

  replica2:
    image: ghcr.io/tigerbeetle/tigerbeetle@sha256:177d6fbd12a3dab1782212cdaf034b5f9cb1bf73804b66116980bfe1064cc3b6
    security_opt: ["seccomp=unconfined"]
    entrypoint: ["/bin/sh", "/scripts/replica.sh", "2"]
    networks: { tb: { ipv4_address: 10.240.0.12 } }
    volumes:
      - ./replica.sh:/scripts/replica.sh:ro

  driver:
    build:
      context: ./driver
      dockerfile: Containerfile
    image: localhost/tdvmm-tigerbeetle-driver:corpus
    # The driver runs the cluster's REPL (io_uring), so it unconfines seccomp too.
    security_opt: ["seccomp=unconfined"]
    networks: { tb: { ipv4_address: 10.240.0.20 } }
    depends_on:
      - replica0
      - replica1
      - replica2

# User-defined bridge network with a fixed subnet, so per-service ipv4_address is
# honored and stable across container restarts (closed-world: this is an internal
# subnet the guest owns, not a host address). Sole network in the guest; the
# 10.240.0.0/24 range avoids podman's 10.88/10.89 defaults.
networks:
  tb:
    ipam:
      config:
        - subnet: 10.240.0.0/24
