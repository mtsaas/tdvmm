# tdvmm — DRIVERLAB: the driver verdict-contract acceptance stack.
#
# Deliberately tiny (no real workload): its whole job is to exercise what a
# driver can do to a RUN's outcome, so the 0/1/2/3 exit contract has a test.
# ONE bake covers every case — the behavior is chosen per run with
# `--cmdline ... tdvmm.drivermode=<mode>`, which the guest's compose-up.sh
# exports as TDVMM_DRIVERMODE and compose interpolates below:
#
#   pass    driver calls finish(0)                    -> tdvmm run exits 0
#   fail    driver calls finish(1, "...")             -> exits 1
#   faults  kill/start a peer, then finish(0)         -> exits 0
#   hang    driver never finishes                     -> --wall-timeout, exits 2
#
# Driven by scripts/driver_test.sh.

services:
  peer:
    image: docker.io/library/busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
    # A long sleep, so an idle guest parks (HLT) and fast-forwards.
    entrypoint: ["/bin/sh", "-c", "while true; do sleep 3600; done"]

  driver:
    build:
      context: ./driver
      dockerfile: Containerfile
    image: localhost/tdvmm-driverlab-driver:corpus
    depends_on:
      - peer
    environment:
      DRIVER_MODE: "${TDVMM_DRIVERMODE:-pass}"
    volumes:
      - ../../../sdk/python/tdvmm.py:/app/tdvmm.py:ro
      - ./driver/driver.py:/app/driver.py:ro
    command: ["/app/driver.py"]
