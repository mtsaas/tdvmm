# generated by tdvmm build -- do not edit
name: tdvmm_configpipeline
services:
  sidecar:
    command:
    - /bin/sh
    - -c
    - "echo \"TDVMM_SIDECAR_START ts=$$(date -u +%H:%M:%S)\"\n# Poll the SHARED named\
      \ volume on a short cadence (a virtual sleep FF\n# collapses) so we reliably\
      \ observe the worker's write regardless of\n# start order, and announce the\
      \ first time we see it.\nseen=0\ni=0\nwhile :; do\n  i=$$((i + 1))\n  latest=\"\
      $$(cat /var/state/latest.txt 2>/dev/null)\"\n  echo \"TDVMM_SIDECAR_READ iter=$$i\
      \ latest=$${latest:-<none>} ts=$$(date -u +%H:%M:%S)\"\n  case \"$$latest\"\
      \ in\n    worker-iter-*)\n      if [ \"$$seen\" -eq 0 ]; then\n        echo\
      \ \"TDVMM_SIDECAR_SHARED_OK latest=$$latest (read worker data via shared named\
      \ volume)\"\n        seen=1\n      fi\n      ;;\n  esac\n  sleep 5\ndone\n"
    depends_on:
    - worker
    image: docker.io/library/busybox@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
    volumes:
    - state:/var/state:ro
    - /run/tdvmm/events:/run/tdvmm/events:rw
    - /run/tdvmm/ctl:/run/tdvmm/ctl:rw
  worker:
    environment:
      INTERVAL_SECONDS: ${TDVMM_INTERVAL:-3600}
    image: localhost/tdvmm-configpipeline-worker@sha256:c05937c63df870e5f337543187d64a50975ec54794df45ed06e4182348dc4422
    volumes:
    - /var/lib/tdvmm-stack/binds/worker/config:/etc/app:rw
    - state:/var/state
    - /run/tdvmm/events:/run/tdvmm/events:rw
    - /run/tdvmm/ctl:/run/tdvmm/ctl:rw
volumes:
  state: null
