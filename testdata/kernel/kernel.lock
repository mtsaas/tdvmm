# tdvmm guest kernel pin (Fable Part C).
#
# The guest vmlinux is compiled FROM SOURCE in the pinned builder container:
# the sha-pinned tarball below is built with the recorded config, and the
# result must match KERNEL_SHA256 byte-for-byte before it is cached. Nothing
# precompiled is ever downloaded; no host kernel toolchain is required. This
# file and the config are embedded into the tdvmm binary at compile time.
#
# Regenerate with:  tdvmm build-kernel --record
