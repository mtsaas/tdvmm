# tdvmm e2e test manifest (goal-3a).
#
# The single source of truth for the tiered runner (scripts/test.sh). Each
# [[test]] declares:
#   name     unique id; also `scripts/test.sh <name>` runs just this one.
#   tier     T0 | T1 | T2 | T3   (fast=T0+T1, merge=T0..T2, nightly=all).
#   tags     scheduling hints:
#              parallel-safe   -> runs in the bounded parallel POOL. Only tests
#                                 whose assertions are functional / virtual-time
#                                 and that touch no shared committed output.
#              perf-exclusive  -> wall-clock / per-hop assertions (load-sensitive)
#                                 -> NEVER in the pool; run SERIALIZED in the quiet
#                                 section after the pool drains.
#              needs-bake      -> runs `tdvmm build`, or writes a shared per-stack
#                                 artifact -> serialized (no shared-output races).
#   timeout  wall-clock seconds; the runner wraps each test in `timeout`.
#   requires (optional) space-separated repo-relative paths that must exist, else
#            the test is reported SKIP (never silently passed).
#   cmd      the command, run from the repo root.
#   desc     one line for the coverage inventory.
#
# SCHEDULING: a test runs in the parallel pool iff it is tagged `parallel-safe`;
# everything else runs serially in the quiet section. This keeps perf/per-hop
# assertions off the loaded pool and prevents two bakes from clobbering the same
# committed initramfs/lock.
#
# COVERAGE FLOOR (never cut, only re-tiered): boot works; FF collapses idle with
# exact cadence; repeatability; bake rejects what it must; artifact
# reproducibility; per-hop budget. fast (subset of) merge (subset of) nightly.

# ============================ T0 — cargo test ==============================

[[test]]
name = "cargo-test"
tier = "T0"
tags = ["parallel-safe"]
timeout = 300
requires = ""
cmd = "cargo test --release"
desc = "unit/integration Rust tests (the only fast tier before this work)"

# ============================ T1 — fast (<=~90s) ===========================

[[test]]
name = "agent-deps"
tier = "T1"
tags = ["parallel-safe"]
timeout = 90
requires = "tdvmm-agent/deps.allow"
cmd = "scripts/agent_deps_check.sh"
desc = "FLOOR(agent minimalism): cargo tree -p tdvmm-agent == committed allowlist (no heavy deps)"

[[test]]
name = "smoke-busybox"
tier = "T1"
tags = ["parallel-safe"]
timeout = 90
requires = "testdata/initramfs/initramfs.cpio.gz testdata/kernel/vmlinux-6.1.128"
cmd = "scripts/smoke_test.sh 45"
desc = "FLOOR(boot): busybox guest boots to the TDVMM_BOOT_OK serial marker"

[[test]]
name = "interactive-exit"
tier = "T1"
tags = ["parallel-safe"]
timeout = 180
requires = "testdata/initramfs/initramfs.cpio.gz testdata/kernel/vmlinux-6.1.128"
cmd = "scripts/smoke_test_interactive_exit.sh 20"
desc = "exit respawns; reboot/poweroff self-exit(0); horizon bounds wedge(3); mode line"

[[test]]
name = "bake-reject"
tier = "T1"
tags = ["parallel-safe"]
timeout = 60
requires = ""
cmd = "scripts/bake_reject_test.sh"
desc = "FLOOR(bake-rejects): rejection corpus via static --validate-only (no VM/bake)"

[[test]]
name = "smoke-container"
tier = "T1"
tags = ["needs-bake"]
timeout = 300
requires = "testdata/stacks/spinner/compose.yml testdata/kernel/vmlinux-6.1.128"
cmd = "scripts/smoke_test_container.sh 120"
desc = "bake+run the minimal spinner stack; guest creates a podman bridge network and runs a digest-pinned image offline"

# ============================ T2 — merge ===================================

[[test]]
name = "ff-demo-short"
tier = "T2"
tags = ["perf-exclusive", "needs-bake"]
timeout = 200
requires = ""
cmd = "scripts/ff_demo.sh 6 150"
desc = "FLOOR(FF cadence + per-hop): insert-trim FF workload, short horizon (6 vhours)"

[[test]]
name = "ff-repeat"
tier = "T2"
tags = ["perf-exclusive", "needs-bake"]
timeout = 360
requires = ""
cmd = "scripts/ff_repeat.sh 6 150"
desc = "FLOOR(repeatability): ff_demo twice -> identical guest row sequence"

# NOTE: the corpus is now the flagship `demo` stack (corpus-demo). It exercises
# depends_on service_healthy gating, build: contexts, and named/bind volumes
# together, so the retired single-feature corpus stacks add nothing over it.

[[test]]
name = "corpus-demo"
tier = "T2"
tags = ["perf-exclusive", "needs-bake"]
timeout = 400
requires = ""
cmd = "MAX_VIRTUAL_TIME=600s scripts/corpus_test.sh demo"
desc = "flagship capability-reference stack (gRPC api + client + worker over postgres+redis, dual health gates, build: context)"

# ============================ T3 — nightly =================================

[[test]]
name = "agent-size"
tier = "T3"
tags = ["needs-bake"]
timeout = 300
requires = "tdvmm-agent/Cargo.toml tdvmm-agent/images.lock"
cmd = "scripts/agent_size_check.sh"
desc = "FLOOR(agent minimalism): stripped musl tdvmm-agent <= 3 MiB (pinned builder)"

[[test]]
name = "agent-repro"
tier = "T3"
tags = ["needs-bake"]
timeout = 400
requires = "tdvmm-agent/Cargo.toml tdvmm-agent/images.lock"
cmd = "scripts/agent_double_build.sh"
desc = "FLOOR(agent repro): two fresh-container builds of tdvmm-agent are byte-identical"

[[test]]
name = "bake-repeat-insert-trim"
tier = "T3"
tags = ["needs-bake"]
timeout = 400
requires = ""
cmd = "scripts/bake_repeat_test.sh testdata/stacks/insert-trim/compose.yml"
desc = "FLOOR(artifact repro): re-bake (--no-cache) -> identical lock + digests (insert-trim)"

[[test]]
name = "bake-repeat-demo"
tier = "T3"
tags = ["needs-bake"]
timeout = 500
requires = ""
cmd = "scripts/bake_repeat_test.sh testdata/stacks/demo/compose.yml"
desc = "FLOOR(artifact repro): re-bake (--no-cache) -> identical lock + content-ids (demo build: contexts)"

[[test]]
name = "artifact-test"
tier = "T3"
tags = ["perf-exclusive", "needs-bake"]
timeout = 900
requires = ""
cmd = "scripts/artifact_test.sh insert-trim"
desc = "FLOOR(artifact repro): .tdvmm bit-identical, inspect/verify, run offline, run==boot"

[[test]]
name = "ff-demo-long"
tier = "T3"
tags = ["perf-exclusive", "needs-bake"]
timeout = 400
requires = ""
cmd = "scripts/ff_demo.sh 24 300"
desc = "long-horizon FF (24 vhours): cadence + per-hop + speedup"

[[test]]
name = "pgcluster-driver"
tier = "T3"
tags = ["needs-bake"]
timeout = 900
requires = "testdata/stacks/pgcluster/compose.yml"
cmd = "mkdir -p .tdvmm-test-results && ./target/release/tdvmm build pgcluster testdata/stacks/pgcluster/compose.yml -o .tdvmm-test-results/pgcluster.tdvmm --no-progress && ./target/release/tdvmm run .tdvmm-test-results/pgcluster.tdvmm --wall-timeout 780 --mem 3072"
desc = "flagship driver test: a Postgres pair with synchronous replication, partitioned by its own driver container WHILE a write is in flight -> the commit must block, then complete after heal"

[[test]]
name = "tigerbeetle-driver"
tier = "T3"
tags = ["needs-bake"]
timeout = 900
requires = "testdata/stacks/tigerbeetle/compose.yml"
cmd = "mkdir -p .tdvmm-test-results && ./target/release/tdvmm build tigerbeetle testdata/stacks/tigerbeetle/compose.yml -o .tdvmm-test-results/tigerbeetle.tdvmm --no-progress && ./target/release/tdvmm run .tdvmm-test-results/tigerbeetle.tdvmm --wall-timeout 300 --mem 10240"
desc = "consensus driver test: a 3-replica TigerBeetle cluster whose driver KILLS a minority replica with a transfer batch in flight -> commits keep landing on the quorum, then the replica restarts and rejoins"

[[test]]
name = "workload-realtime"
tier = "T3"
tags = ["perf-exclusive", "needs-bake"]
timeout = 300
requires = ""
cmd = "scripts/smoke_test_workload.sh 240"
desc = "FF-OFF real-time park path (the A/B counterpart; intentionally real-sleeps)"
