tier = "T3"
tags = ["needs-bake"]
timeout = 300
requires = "dvmm-agent/Cargo.toml dvmm-agent/images.lock"
cmd = "scripts/agent_size_check.sh"
desc = "FLOOR(agent minimalism): stripped musl dvmm-agent <= 3 MiB (pinned builder)"

[[test]]
name = "agent-repro"
tier = "T3"
tags = ["needs-bake"]
timeout = 400
requires = "dvmm-agent/Cargo.toml dvmm-agent/images.lock"
cmd = "scripts/agent_double_build.sh"
desc = "FLOOR(agent repro): two fresh-container builds of dvmm-agent are byte-identical"

[[test]]
name = "corpus-full"
tier = "T3"
tags = ["perf-exclusive", "needs-bake"]
timeout = 600
requires = ""
cmd = "scripts/corpus_test.sh configpipeline svcchain"
desc = "remaining corpus (configpipeline + svcchain); with T2's webstack + corpus-demo = full corpus"

