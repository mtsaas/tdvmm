[package]
name = "dvmm-agent"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Static (musl) guest-side control-channel executor for the deterministic VMM. Baked into every .dvmm; speaks dvmm-proto over ttyS1."

[[bin]]
name = "dvmm-agent"
path = "src/main.rs"

# DEP ALLOWLIST (Fable §1): dvmm-proto + serde_json + std ONLY. `serde` (derive)
# is pulled in transitively by dvmm-proto already, so declaring it here to derive
# the podman-ps parser adds NO new crate to the tree. Must NOT pull
# kvm-ioctls/vm-memory/linux-loader/vm-superio/libc/regex/etc. — enforced by
# scripts/agent_deps_check.sh against dvmm-agent/deps.allow.
[dependencies]
dvmm-proto = { path = "../dvmm-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
