# Pinned rust+musl BUILDER image for the reproducible dvmm-agent build (Fable §2).
#
# The agent is cross-compiled to a static x86_64-unknown-linux-musl binary INSIDE
# this container (invoked by `dvmm build` / `dvmm build-agent` via podman), NOT on
# the host — host rustc drift would change the bytes and thus the `.dvmm` hash.
# This image is Alpine-hosted, so `x86_64-unknown-linux-musl` is its NATIVE target
# (no `rustup target add`); the build uses `rust-lld` + self-contained linking, so
# no external C toolchain is needed for the pure-Rust agent.
#
# Pinned by DIGEST. Bumping it is a toolchain change: it MUST miss the bake cache
# (the digest is folded into the cache key) and requires re-verifying the
# agent double-build byte-identity gate.
BUILDER_IMAGE=docker.io/library/rust:1.97-alpine3.22
BUILDER_DIGEST=sha256:b348cb409ac0a73de15065997a360063cf87465574a15e3e4469862cb8996f02
